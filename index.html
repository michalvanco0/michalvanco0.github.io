    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');
        
        * {
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            height: 100%;
            width: 100vw;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #1a0509;
        }

        #map {
            height: 100%;
            width: 100%;
            z-index: 1;
            background: #1a0509;
        }

        /* Dark Burgundy Tint Overlay for Leaflet Map Tiles */
        .leaflet-tile-pane {
            filter: brightness(0.8) contrast(1.15) saturate(0.85) sepia(0.35) hue-rotate(300deg);
        }

        /* Custom Popup Styling */
        .leaflet-popup-content-wrapper {
            background: rgba(38, 6, 14, 0.96);
            backdrop-filter: blur(12px);
            color: #f8fafc;
            border: 1px solid #800020;
            border-radius: 14px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.8), 0 8px 10px -6px rgba(128, 0, 32, 0.6);
            padding: 4px;
        }

        .leaflet-popup-tip {
            background: rgba(38, 6, 14, 0.96);
            border: 1px solid #800020;
        }

        .leaflet-container a.leaflet-popup-close-button {
            color: #e2e8f0;
            padding: 8px 8px 0 0;
        }
        .leaflet-container a.leaflet-popup-close-button:hover {
            color: #fbbf24;
        }

        /* Custom Scrollbar for Drawer/Popups */
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(30, 5, 10, 0.5);
        }
        ::-webkit-scrollbar-thumb {
            background: #800020;
            border-radius: 4px;
        }

        /* Pulse animation for base point */
        @keyframes pulse-burgundy {
            0% {
                box-shadow: 0 0 0 0 rgba(225, 29, 72, 0.8);
            }
            70% {
                box-shadow: 0 0 0 16px rgba(225, 29, 72, 0);
            }
            100% {
                box-shadow: 0 0 0 0 rgba(225, 29, 72, 0);
            }
        }

        .base-pin-pulse {
            border-radius: 50%;
            animation: pulse-burgundy 2s infinite;
        }

        /* Custom Marker CSS */
        .custom-marker {
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
            cursor: pointer;
        }

        .custom-marker:hover {
            transform: scale(1.22);
            z-index: 1000 !important;
        }
    </style>
</head>

        coords: [49.274439, 20.777780],
        icon: "fa-cross",
        desc: "Pobožné a pokojné miesto Kalvárie s jednotlivými zastaveniami zasadenej do tichého prírodného prostredia nad obecou Plavnica.",
        link: "https://www.plavnica.sk/zivot-v-obci/cirkev"
    },
	            {
                id: 'restauracia-hranica',
                name: "Reštaurácia Hranica (Mníšek nad Popradom)",
                category: ["gastro"],
                coords: [49.4158, 20.7165],
                icon: "fa-utensils",
                desc: "Tradičná lokálna reštaurácia a pohostinstvo pri hraničnom priechode Mníšek nad Popradom.",
                link: "https://www.facebook.com/restauraciahranica/"
            },
        ];

        // Bratislava to Medzibrodie Coordinates Route
        const routeCoordinates = [
            [48.148, 17.107], // Bratislava
            [48.306, 17.291], // Trnava
            [48.788, 17.886], // Nové Mesto nad Váhom
            [48.894, 18.044], // Trenčín
            [49.223, 18.739], // Žilina
            [49.138, 19.299], // Ružomberok
            [49.055, 19.600], // Liptovský Mikuláš
            [49.054, 20.297], // Poprad
            [49.200, 20.520], // Kežmarok
            [49.301, 20.688], // Stará Ľubovňa
            [49.3458, 20.6865], // Sedlo Vabec
            [49.365, 20.702], // Hraničné
            [49.413, 20.713]  // Medzibrodie
        ];

        // Initialize Map
        const map = L.map('map', {
            zoomControl: false,
            attributionControl: false
        }).setView([49.37, 20.70], 11);

        // CartoDB Dark Matter Tiles - 100% FREE, NO API KEY REQUIRED
        L.tileLayer('https://basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}.png?key=cb1_4qtn_1_043106a6b630d0268cd166ce', {
            maxZoom: 19,
            subdomains: 'abcd'
        }).addTo(map);

        // Add Zoom Control
        L.control.zoom({ position: 'bottomright' }).addTo(map);

        // Layers and State Storage
        let markersLayer = L.layerGroup().addTo(map);
        let routePolyline = null;
        let isRouteVisible = false;

        // Custom Marker HTML Builder
        function createCustomIcon(location) {
            const isBase = location.isBase;
            const bgClass = isBase 
                ? 'bg-amber-400 text-stone-950 border-2 border-white' 
                : 'bg-rose-900 text-rose-100 border border-rose-500/70 shadow-lg';
            const pulseClass = isBase ? 'base-pin-pulse' : '';
            const size = isBase ? 'w-10 h-10 text-base' : 'w-8 h-8 text-xs';

            const html = `
                <div class="custom-marker ${bgClass} ${pulseClass} ${size} shadow-rose-950/90">
                    <i class="fa-solid ${location.icon}"></i>
                </div>
            `;

            return L.divIcon({
                html: html,
                className: '',
                iconSize: isBase ? [40, 40] : [32, 32],
                iconAnchor: isBase ? [20, 20] : [16, 16],
                popupAnchor: [0, -20]
            });
        }

        // Render Markers based on Category Filter
        function renderMarkers(filter = 'all') {
            markersLayer.clearLayers();
            const listContainer = document.getElementById('locationsList');
            listContainer.innerHTML = '';

            let count = 0;

            locations.forEach(loc => {
                if (filter === 'all' || loc.category.includes(filter)) {
                    count++;
                    
                    // Create Leaflet Marker
                    const marker = L.marker(loc.coords, {
                        icon: createCustomIcon(loc)
                    });

                    // Create Popup
                    const popupHTML = `
                        <div class="p-2 max-w-[240px]">
                            <div class="flex items-center gap-2 mb-1.5">
                                <span class="w-6 h-6 rounded-lg bg-rose-900 border border-rose-700 flex items-center justify-center text-amber-400 text-xs shrink-0">
                                    <i class="fa-solid ${loc.icon}"></i>
                                </span>
                                <h4 class="font-bold text-sm text-rose-100 leading-tight">${loc.name}</h4>
                            </div>
                            <p class="text-xs text-rose-200/80 mb-3 leading-relaxed">${loc.desc}</p>
                            <a href="${loc.link}" target="_blank" rel="noopener noreferrer" class="inline-flex items-center justify-center gap-1.5 w-full bg-rose-900 hover:bg-rose-800 text-amber-300 font-semibold text-xs py-1.5 px-3 rounded-lg border border-rose-700/60 transition-all">
                                <span>Otvoriť detail</span>
                                <i class="fa-solid fa-arrow-up-right-from-square text-[10px]"></i>
                            </a>
                        </div>
                    `;

                    marker.bindPopup(popupHTML);
                    markersLayer.addLayer(marker);

                    // Add Item to Bottom Drawer List
                    const itemHTML = `
                        <div onclick="focusLocation(${loc.coords[0]}, ${loc.coords[1]}, '${loc.id}')" class="bg-rose-900/40 hover:bg-rose-900/80 border border-rose-800/40 rounded-xl p-2.5 flex items-start gap-3 cursor-pointer transition-all active:scale-[0.98]">
                            <div class="w-8 h-8 rounded-lg bg-rose-900 border border-rose-700/60 flex items-center justify-center text-amber-400 shrink-0 mt-0.5">
                                <i class="fa-solid ${loc.icon}"></i>
                            </div>
                            <div class="flex-1 min-w-0">
                                <h5 class="font-semibold text-xs text-rose-100 truncate">${loc.name}</h5>
                                <p class="text-[11px] text-rose-300/70 line-clamp-2 mt-0.5">${loc.desc}</p>
                            </div>
                        </div>
                    `;
                    listContainer.insertAdjacentHTML('beforeend', itemHTML);
                }
            });

            document.getElementById('locationCount').innerText = count;
        }

        // Category Filter Switching
        function filterCategory(cat) {
            document.querySelectorAll('.cat-btn').forEach(btn => {
                btn.classList.remove('bg-rose-800', 'text-white');
                btn.classList.add('bg-rose-950/80', 'text-rose-200');
            });

            const activeBtn = document.getElementById(`btn-${cat}`);
            if(activeBtn) {
                activeBtn.classList.remove('bg-rose-950/80', 'text-rose-200');
                activeBtn.classList.add('bg-rose-800', 'text-white');
            }

            renderMarkers(cat);
        }

        // Focus Location from Drawer List
        function focusLocation(lat, lng, id) {
            map.flyTo([lat, lng], 13, { duration: 1.2 });
            toggleList();

            markersLayer.eachLayer(layer => {
                const latLng = layer.getLatLng();
                if (Math.abs(latLng.lat - lat) < 0.0001 && Math.abs(latLng.lng - lng) < 0.0001) {
                    setTimeout(() => layer.openPopup(), 1200);
                }
            });
        }

        // Toggle Bratislava Route
        function toggleRoute() {
            if (!isRouteVisible) {
                routePolyline = L.polyline(routeCoordinates, {
                    color: '#fbbf24',
                    weight: 3.5,
                    opacity: 0.9,
                    dashArray: '8, 8',
                    lineCap: 'round'
                }).addTo(map);

                map.fitBounds(routePolyline.getBounds(), { padding: [50, 50] });

                document.getElementById('routeBtnText').innerText = 'Skryť trasu BA';
                document.getElementById('routeBtn').classList.add('ring-2', 'ring-amber-400');
                isRouteVisible = true;
            } else {
                if (routePolyline) {
                    map.removeLayer(routePolyline);
                }
                document.getElementById('routeBtnText').innerText = 'Trasa z Bratislavy';
                document.getElementById('routeBtn').classList.remove('ring-2', 'ring-amber-400');
                isRouteVisible = false;
                resetView();
            }
        }

        // Reset Camera to Medzibrodie
        function resetView() {
            map.flyTo([49.37, 20.70], 11, { duration: 1 });
        }

        // Toggle Drawer List
        function toggleList() {
            const drawer = document.getElementById('listDrawer');
            drawer.classList.toggle('translate-y-full');
        }

        // Initial Load
        window.onload = function() {
            renderMarkers('all');
        };
    </script>
</body>
</html>
